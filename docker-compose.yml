services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: predictive_maintenance
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d predictive_maintenance"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://platform:platform@db:5432/predictive_maintenance
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "${API_PORT:-8080}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 6
  frontend:
    build:
      context: frontend
      args:
        VITE_API_BASE_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
