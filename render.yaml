services:
  - type: web
    name: devispace-industrial-pm-platform
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devispace-industrial-pm-db
          property: connectionString

databases:
  - name: devispace-industrial-pm-db
    plan: free
    region: singapore
    databaseName: predictive_maintenance
    user: platform
    ipAllowList: []
